  <script>

      theme: {
        extend: {
          colors: {

        }

    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; margin: 0; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .step-hover { transition: all 0.2s ease; }
    .step-hover:hover { transform: scale(1.02); }
    .step-active { animation: stepPulse 1.2s ease-in-out infinite; }
    @keyframes stepPulse { 0%,100%{ box-shadow: 0 0 0 0 rgba(59,130,246,0); } 50%{ box-shadow: 0 0 12px 4px rgba(59,130,246,0.4); } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
  </style>
</head>

    /* ================================================================
       ROUTE GENERATION ALGORITHM
       ================================================================ */

    function generateRoute(diffPref, totalMinutes, startBase) {
      const scores = PREF_SCORES[diffPref];
      const route = [];
      let clock = 0;
      let currentBase = startBase;
      const runHistory = {};   // runId → step when last skied
      const liftHistory = {};  // liftId → step when last used
      const areaVisits = {};   // area → visit count
      let step = 0;
      let safety = 0;

      while (clock < totalMinutes && safety < 300) {
        safety++;
        const remaining = totalMinutes - clock;
        if (remaining < 5) break;

        // ── PICK A LIFT ──
        const base = BASES[currentBase];
        if (!base) break;

        let bestLift = null;
        let bestLiftScore = -1;

        for (const liftId of base.lifts) {
          const lift = LIFTS[liftId];
          if (!lift || lift.time > remaining - 3) continue;

          // How good are the runs this lift serves? Factor in which ones we've already skied
          let runQuality = 0;
          let freshRunCount = 0;
          for (const rId of lift.topRuns) {
            const r = RUNS[rId];
            if (!r) continue;
            const ds = scores[r.difficulty] || 0;
            const runAge = runHistory[rId] != null ? step - runHistory[rId] : 99;
            const runFresh = runAge > 3 ? 1.0 : 0.2; // big penalty for recently skied runs
            runQuality += ds * runFresh;
            if (runAge > 3) freshRunCount++;
          }
          runQuality /= lift.topRuns.length || 1;

          // Strongly prefer lifts we haven't taken recently
          const liftAge = liftHistory[liftId] != null ? step - liftHistory[liftId] : 99;
          const freshness = Math.min(liftAge / 8, 1); // takes 8 steps to fully reset (was 3)

          // Bonus for lifts that access runs we haven't done yet
          const explorationBonus = freshRunCount / (lift.topRuns.length || 1);

          // Bonus for lifts that go to different areas than recent
          const liftAreas = new Set(lift.topRuns.map(rId => RUNS[rId]?.area).filter(Boolean));
          let areaNovelty = 0;
          for (const area of liftAreas) {
            const v = areaVisits[area] || 0;
            areaNovelty += 1 / (1 + v * 0.4);
          }
          areaNovelty /= liftAreas.size || 1;

          const score = runQuality * 0.30 + freshness * 0.25 + explorationBonus * 0.25 + areaNovelty * 0.10 + Math.random() * 0.10;
          if (score > bestLiftScore) { bestLiftScore = score; bestLift = lift; }
        }

        if (!bestLift) break;

        clock += bestLift.time;
        liftHistory[bestLift.id] = step;
        route.push({ type:"lift", id:bestLift.id, name:bestLift.name, time:bestLift.time, cumTime:clock });

        // ── SKI DOWN — chain runs until we reach a base ──
        let availableRunIds = [...bestLift.topRuns];

        while (availableRunIds.length > 0 && clock < totalMinutes && safety < 300) {
          safety++;

          let bestRun = null;
          let bestRunScore = -Infinity;

          // Stuck-loop detector: how dominant has one area been over the last 6 runs?
          // (regardless of difficulty preference, we need to escape eventually)
          const recentAreas = route.filter(s => s.type === "run").slice(-6).map(s => s.area);
          let dominantArea = null, dominantCount = 0;
          if (recentAreas.length >= 4) {
            const counts = {};
            for (const a of recentAreas) counts[a] = (counts[a] || 0) + 1;
            for (const a in counts) if (counts[a] > dominantCount) { dominantCount = counts[a]; dominantArea = a; }
          }

          for (const rId of availableRunIds) {
            const run = RUNS[rId];
            if (!run) continue;

            const diffScore = scores[run.difficulty] || 0;
            const age = runHistory[rId] != null ? step - runHistory[rId] : 99;
            const freshness = Math.min(age / 6, 1);
            const visits = areaVisits[run.area] || 0;
            const variety = 1 / (1 + visits * 0.3); // stronger area penalty
            const jitter = Math.random() * 0.12;

            // Escape hatch: if recent runs have been stuck circling one area, strongly
            // favor any run that leaves it — regardless of difficulty preference —
            // to prevent infinite loops (e.g. "just-blues" trapped at Frenchman's Base)
            const stuckEscape = (dominantCount >= 4 && run.area !== dominantArea) ? (dominantCount - 3) * 0.3 : 0;

            const score = diffScore * 0.40 + freshness * 0.28 + variety * 0.20 + jitter + stuckEscape;
            if (score > bestRunScore) { bestRunScore = score; bestRun = run; }
          }

          if (!bestRun) break;

          clock += bestRun.time;
          runHistory[bestRun.id] = step;
          areaVisits[bestRun.area] = (areaVisits[bestRun.area] || 0) + 1;
          step++;

          const meta = DIFF_META[bestRun.difficulty];
          route.push({
            type:"run", id:bestRun.id, name:bestRun.name, difficulty:bestRun.difficulty,
            diffLabel:meta.label, diffColor:meta.color, diffIcon:meta.icon,
            area:bestRun.area, time:bestRun.time, cumTime:clock
          });

          // Figure out next options
          const nextRuns = [];
          const nextBases = [];

          for (const tId of bestRun.connectsTo) {
            if (BASES[tId]) {
              nextBases.push(tId);
            } else if (RUNS[tId]) {
              nextRuns.push(tId);
            }
          }

          const timeLeft = totalMinutes - clock;

          // If time is getting low, or only bases available, head to base
          if (nextBases.length > 0 && (nextRuns.length === 0 || timeLeft < 14)) {
            // Pick the base with the freshest/most varied lift options
            if (nextBases.length === 1) {
              currentBase = nextBases[0];
            } else {
              let bestBase = nextBases[0];
              let bestBaseScore = -1;
              for (const bId of nextBases) {
                const b = BASES[bId];
                if (!b) continue;
                let bScore = 0;
                for (const lId of b.lifts) {
                  const la = liftHistory[lId] != null ? step - liftHistory[lId] : 99;
                  bScore += Math.min(la / 5, 1);
                }
                bScore /= b.lifts.length || 1;
                // Bonus for bases with more lift choices
                bScore += b.lifts.length * 0.15;
                bScore += Math.random() * 0.1;
                if (bScore > bestBaseScore) { bestBaseScore = bScore; bestBase = bId; }
              }
              currentBase = bestBase;
            }
            break;
          } else if (nextRuns.length > 0) {
            // Decision point: some of these "next runs" might also give base access
            // If time < 20 min, prefer runs that lead toward bases
            if (timeLeft < 20 && nextBases.length > 0) {
              // 60% chance to take the base, 40% to keep skiing
              if (Math.random() < 0.6) { currentBase = nextBases[0]; break; }
            }
            availableRunIds = nextRuns;
          } else {
            break;
          }
        }
      }

      // Calculate stats
      let totalLiftTime = 0, totalSkiTime = 0, runsSkied = 0, liftsRidden = 0;
      const diffCounts = {};
      for (const item of route) {
        if (item.type === "lift") { totalLiftTime += item.time; liftsRidden++; }
        else { totalSkiTime += item.time; runsSkied++; diffCounts[item.difficulty] = (diffCounts[item.difficulty]||0) + 1; }
      }

      return {
        steps: route,
        stats: { totalTime: clock, totalLiftTime, totalSkiTime, runsSkied, liftsRidden, diffCounts, endBase: currentBase }
      };
    }

    /* ================================================================
       BREAK INSERTION — walks a generated route and inserts bathroom/
       lunch stops at the nearest lodge once enough time has passed.
       Only inserts at natural stopping points: right after riding a
       lift that tops out at a lodge, or right before the next lift
       at a base that has one.
       ================================================================ */

    function insertBreaks(steps, endBase, { bathroomEnabled, bathroomInterval, lunchEnabled }) {
      const BATHROOM_DURATION = 10;
      const LUNCH_DURATION = 35;
      const LUNCH_AFTER_FRACTION = 0.45; // trigger lunch once ~45% of the day's ski time has passed

      const totalSkiMinutes = steps.length ? steps[steps.length - 1].cumTime : 0;
      const lunchAfterMinutes = totalSkiMinutes * LUNCH_AFTER_FRACTION;

      const result = [];
      let timeSinceBathroom = 0;
      let lunchTaken = !lunchEnabled;
      let cumAdjust = 0;

      for (let i = 0; i < steps.length; i++) {
        const step = steps[i];
        const adjusted = { ...step, cumTime: step.cumTime + cumAdjust };
        result.push(adjusted);
        timeSinceBathroom += step.time;

        // Which facility (if any) is reachable right after this step?
        let facility = null;
        if (step.type === "lift") {
          facility = Object.values(FACILITIES).find(f => f.afterLifts.includes(step.id));
        } else if (step.type === "run") {
          const nextStep = steps[i + 1];
          const arrivingBase = nextStep ? (nextStep.type === "lift" ? LIFTS[nextStep.id].base : null) : endBase;
          if (arrivingBase) facility = Object.values(FACILITIES).find(f => f.atBases.includes(arrivingBase));
        }

        if (!facility) continue;

        if (!lunchTaken && facility.hasFood && adjusted.cumTime >= lunchAfterMinutes) {
          result.push({ type:"break", breakType:"lunch", name:`Lunch at ${facility.name}`, time: LUNCH_DURATION, cumTime: adjusted.cumTime + LUNCH_DURATION });
          cumAdjust += LUNCH_DURATION;
          lunchTaken = true;
          timeSinceBathroom = 0;
        } else if (bathroomEnabled && facility.hasBathroom && timeSinceBathroom >= bathroomInterval) {
          result.push({ type:"break", breakType:"bathroom", name:`Bathroom break at ${facility.name}`, time: BATHROOM_DURATION, cumTime: adjusted.cumTime + BATHROOM_DURATION });
          cumAdjust += BATHROOM_DURATION;
          timeSinceBathroom = 0;
        }
      }

      return { steps: result, addedTime: cumAdjust };
    }

    /* ================================================================
       REACT COMPONENTS
       ================================================================ */

    function TrailMap({ route, hoveredRunId, onHoverRun, activeStepIds }) {
      const steps = route?.steps || [];
      // Render inactive paths first (under), then active paths (over) so the active section pops on top
      const inactive = [];
      const active = [];
      steps.forEach((step, i) => {
        const isActive = activeStepIds && activeStepIds.has(step.id);
        (isActive ? active : inactive).push({ step, i });
      });

      const renderStep = ({ step, i }, isActive) => {
        if (step.type === 'run') {
          const pts = RUN_COORDS[step.id];
          if (!pts || pts.length < 2) return null;
          const isHovered = isActive && hoveredRunId === step.id;
          const color = step.difficulty === 'black' ? '#e2e8f0' : (DIFF_META[step.difficulty]?.color || '#888');
          return (
            <polyline key={`r-${i}`}
              points={pts.map(([x,y]) => `${x},${y}`).join(' ')}
              fill="none"
              stroke={isActive ? color : '#64748b'}
              strokeWidth={isActive ? (isHovered ? 12 : 7) : 3}
              strokeLinecap="round"
              strokeLinejoin="round"
              opacity={isActive ? (isHovered ? 1 : 0.9) : 0.22}
              style={{pointerEvents: isActive ? 'stroke' : 'none', cursor: isActive ? 'pointer' : 'default', filter: isHovered ? `drop-shadow(0 0 8px ${color})` : 'none', transition:'stroke-width 0.15s ease, opacity 0.15s ease'}}
              onMouseEnter={isActive ? () => onHoverRun(step.id) : undefined}
              onMouseLeave={isActive ? () => onHoverRun(null) : undefined}
            />
          );
        } else if (step.type === 'lift') {
          const pts = LIFT_COORDS[step.id];
          if (!pts || pts.length < 2) return null;
          const isHovered = isActive && hoveredRunId === step.id;
          return (
            <polyline key={`l-${i}`}
              points={pts.map(([x,y]) => `${x},${y}`).join(' ')}
              fill="none"
              stroke={isActive ? '#fbbf24' : '#64748b'}
              strokeWidth={isActive ? (isHovered ? 9 : 5) : 3}
              strokeDasharray="24,12"
              strokeLinecap="round"
              opacity={isActive ? (isHovered ? 1 : 0.85) : 0.22}
              style={{pointerEvents: isActive ? 'stroke' : 'none', cursor: isActive ? 'pointer' : 'default', filter: isHovered ? 'drop-shadow(0 0 8px #fbbf24)' : 'none', transition:'stroke-width 0.15s ease, opacity 0.15s ease'}}
              onMouseEnter={isActive ? () => onHoverRun(step.id) : undefined}
              onMouseLeave={isActive ? () => onHoverRun(null) : undefined}
            />
          );
        }
        return null;
      };

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-mountain-900 flex items-center justify-center h-[48vh] lg:h-auto">
          <div style={{position:'relative', aspectRatio:'2600 / 1467', maxWidth:'100%', maxHeight:'100%', width:'100%'}}>
            <img src="trail-map.jpg" alt="Bald Mountain Trail Map"
              className="w-full h-full" style={{display:'block', objectFit:'contain'}} />
            <svg
              style={{position:'absolute',top:0,left:0,width:'100%',height:'100%'}}
              viewBox="0 0 2600 1467"
              preserveAspectRatio="none"
            >
              {inactive.map(item => renderStep(item, false))}
              {active.map(item => renderStep(item, true))}
            </svg>
          </div>
        </div>
      );
    }

            <select value={selectedId} onChange={e=>setSelectedId(e.target.value)}
              style={{background:'#334155',color:'white',padding:'4px 8px',borderRadius:6,border:'1px solid #475569',fontSize:13,maxWidth:280}}>
              <optgroup label="── Runs ──">
                {allRuns.map(r=>(
                  <option key={r.id} value={r.id}>
                    {runCoords[r.id]?.length>=2?'✓ ':'  '}{r.name} [{DIFF_META[r.difficulty]?.label}]
                  </option>
                ))}
              </optgroup>
              <optgroup label="── Lifts ──">
                {allLifts.map(l=>(
                  <option key={l.id} value={l.id}>
                    {liftCoords[l.id]?.length>=2?'✓ ':'  '}{l.name}
                  </option>
                ))}
              </optgroup>
            </select>
            <span style={{color:'#94a3b8',fontSize:12}}>{currentPts.length} pts</span>
            <button onClick={handleUndo} disabled={currentPts.length===0}
              style={{padding:'4px 10px',background:'#334155',color:'white',borderRadius:6,border:'1px solid #475569',cursor:'pointer',fontSize:13,opacity:currentPts.length===0?0.4:1}}>Undo</button>

              style={{padding:'4px 10px',background:'#7f1d1d',color:'white',borderRadius:6,border:'none',cursor:'pointer',fontSize:13,opacity:currentPts.length===0?0.4:1}}>Clear</button>
            <span style={{color:'#475569',fontSize:12,marginLeft:4}}>Click map to add waypoints · {isLift?'Lift (dashed)':'Run (solid)'}</span>
            <button onClick={onClose}
              style={{marginLeft:'auto',padding:'4px 12px',background:'#1d4ed8',color:'white',borderRadius:6,border:'none',cursor:'pointer',fontSize:13}}>Done (Shift+E)</button>
          </div>

          {/* Map + JSON side panel */}
          <div style={{display:'flex',flex:1,overflow:'hidden'}}>
            {/* Clickable map */}
            <div style={{flex:1,overflow:'auto',position:'relative',cursor:'crosshair'}} onClick={handleMapClick}>
              <img src="trail-map.jpg" alt="Trail Map" style={{width:'100%',display:'block',userSelect:'none'}} draggable={false} />
              <svg style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',pointerEvents:'none'}}
                viewBox="0 0 2600 1467" preserveAspectRatio="none">
                {/* All defined run paths (faint) */}
                {definedRunPaths.map(([id,pts])=>{
                  const isSel = id===selectedId;
                  const color = DIFF_META[RUNS[id]?.difficulty]?.color||'#888';
                  return <polyline key={id} points={pts.map(([x,y])=>`${x},${y}`).join(' ')}
                    fill="none" stroke={isSel?'#fff':color} strokeWidth={isSel?6:3}
                    strokeLinecap="round" strokeLinejoin="round" opacity={isSel?1:0.45}/>;
                })}
                {/* All defined lift paths (faint dashed) */}
                {definedLiftPaths.map(([id,pts])=>{
                  const isSel = id===selectedId;
                  return <polyline key={id} points={pts.map(([x,y])=>`${x},${y}`).join(' ')}
                    fill="none" stroke={isSel?'#fff':'#fbbf24'} strokeWidth={isSel?6:3}
                    strokeDasharray="20,8" strokeLinecap="round" opacity={isSel?1:0.45}/>;
                })}
                {/* Current item's waypoint dots */}
                {currentPts.map(([x,y],i)=>(

              <div style={{color:'#94a3b8',fontSize:11,lineHeight:'1.5'}}>

              </div>
              <textarea readOnly value={jsonOutput}
                onClick={e=>e.target.select()}
                style={{flex:1,background:'#0f172a',color:'#86efac',fontFamily:'monospace',fontSize:10.5,padding:8,border:'1px solid #334155',borderRadius:6,resize:'none',lineHeight:'1.4'}}/>
            </div>
          </div>
        </div>
      );
    }

    function RouteDisplay({ result, hoveredRunId, onHoverRun, sections, stepToSection, activeSectionIdx, setActiveSectionIdx }) {
      if (!result) return null;
      const totalSections = sections.length;
      const canPrev = activeSectionIdx > 0;
      const canNext = activeSectionIdx < totalSections - 1;

      const formatTime = (mins) => {
        const h = Math.floor(mins / 60);
        const m = Math.round(mins % 60);
        if (h === 0) return `${m}m`;
        return `${h}h ${m}m`;
      };

      return (
        <div className="bg-mountain-800 rounded-xl p-5 border border-slate-700 fade-in">
          <h2 className="text-lg font-semibold mb-3">Your route</h2>
          <RouteStats stats={result.stats} />

          <div className="flex flex-wrap gap-2 mb-4">
            {Object.entries(result.stats.diffCounts).sort((a,b) => (DIFF_META[a[0]]?.sortOrder||0) - (DIFF_META[b[0]]?.sortOrder||0)).map(([diff, count]) => {
              const meta = DIFF_META[diff];
              return (
                <span key={diff} className="text-xs px-2 py-1 rounded-md bg-slate-700/60 text-slate-300 flex items-center gap-1">
                  <span style={{color: diff==='black' ? '#e2e8f0' : meta.color}}>{meta.icon}</span>
                  {count} {meta.label.toLowerCase()}{count > 1 ? 's' : ''}
                </span>
              );
            })}
          </div>

          {/* Section navigation header */}
          {totalSections > 0 && (
            <div className="flex items-center justify-between mb-3 px-1">
              <button onClick={() => canPrev && setActiveSectionIdx(activeSectionIdx - 1)}
                disabled={!canPrev}
                className="text-xs px-3 py-1.5 rounded-md bg-slate-700 hover:bg-slate-600 transition-colors disabled:opacity-30 disabled:cursor-not-allowed font-medium">
                ‹ Prev
              </button>
              <div className="text-sm font-semibold text-slate-300">
                Section {activeSectionIdx + 1} of {totalSections}
              </div>
              <button onClick={() => canNext && setActiveSectionIdx(activeSectionIdx + 1)}
                disabled={!canNext}
                className="text-xs px-3 py-1.5 rounded-md bg-blue-600 hover:bg-blue-500 transition-colors disabled:opacity-30 disabled:cursor-not-allowed font-medium">
                Next ›
              </button>
            </div>
          )}

          {/* Step-by-step itinerary */}
          <div className="space-y-1 max-h-[500px] overflow-y-auto pr-1">
            {result.steps.map((step, i) => {
              const stepSectionIdx = stepToSection?.get(i);
              const inActiveSection = stepSectionIdx === activeSectionIdx;
              const isHovered = inActiveSection && hoveredRunId !== null && step.id === hoveredRunId;
              const diffColor = step.type === 'lift' ? '#dc2626' : step.type === 'break' ? '#f59e0b' : (step.difficulty === 'black' ? '#334155' : (DIFF_META[step.difficulty]?.color || '#666'));
              const glowColor = step.type === 'lift' ? 'rgba(220,38,38,0.4)' : step.type === 'break' ? 'rgba(245,158,11,0.4)' : (step.difficulty === 'black' ? 'rgba(226,232,240,0.3)' : (DIFF_META[step.difficulty]?.color || '#666') + '55');
              const showDivider = step.type === 'lift' && i !== 0;

              return (
                <React.Fragment key={i}>
                  {showDivider && <div className="border-t border-slate-700/50 my-2" />}
                <div
                  onClick={() => stepSectionIdx != null && setActiveSectionIdx(stepSectionIdx)}
                  onMouseEnter={() => inActiveSection && onHoverRun(step.id)}
                  onMouseLeave={() => inActiveSection && onHoverRun(null)}
                  className={`flex items-center gap-3 py-2 px-3 rounded-lg step-hover cursor-pointer ${
                    step.type === 'lift' ? 'bg-slate-700/30' : step.type === 'break' ? 'bg-amber-900/20' : 'bg-slate-800/50'
                  }`}
                  style={isHovered ? {
                    background: step.type === 'lift' ? 'rgba(220,38,38,0.15)' : step.type === 'break' ? 'rgba(245,158,11,0.15)' : `${DIFF_META[step.difficulty]?.color || '#666'}22`,
                    boxShadow: `0 0 16px 4px ${glowColor}, inset 0 0 0 1px ${DIFF_META[step.difficulty]?.color || diffColor}66`,
                    transform: 'scale(1.03)',
                    zIndex: 10,
                    position: 'relative',
                  } : (inActiveSection ? {} : { opacity: 0.4 })}>
                  {/* Step number */}
                  <div className="w-5 text-xs font-bold text-slate-600 flex-shrink-0 text-center">
                    {i + 1}
                  </div>

                  {/* Icon */}
                  <div className="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0" style={{
                    background: diffColor,
                    color: '#fff',
                    boxShadow: isHovered ? `0 0 10px 3px ${glowColor}` : 'none',
                    transition: 'box-shadow 0.2s ease',
                  }}>
                    {step.type === 'lift' ? '▲' : step.type === 'break' ? (step.breakType === 'lunch' ? '🍔' : '🚻') : step.diffIcon}
                  </div>

                  {/* Name & details */}
                  <div className="flex-1 min-w-0">
                    <div className={`text-sm font-medium leading-snug transition-colors ${isHovered ? 'text-white' : ''}`}>
                      {step.type === 'lift' ? `\u{1F6A0} ${step.name}` : step.name}
                    </div>
                    {step.type === 'run' && (
                      <div className={`text-xs transition-colors ${isHovered ? 'text-slate-300' : 'text-slate-500'}`}>{step.area}</div>
                    )}
                  </div>

                  {/* Time */}
                  <div className="text-xs text-slate-400 flex-shrink-0 text-right">
                    <div>{step.time} min</div>
                    <div className="text-slate-600">{formatTime(step.cumTime)}</div>
                  </div>
                </div>
                </React.Fragment>
              );
            })}
          </div>

          {/* End info */}
          <div className="mt-4 pt-3 border-t border-slate-700 text-sm text-slate-400">
            Ending at <span className="text-white font-medium">{BASES[result.stats.endBase]?.name || result.stats.endBase}</span>
            {' '}&middot; Total: {formatTime(result.stats.totalTime)} ({Math.round(result.stats.totalSkiTime)} min skiing, {Math.round(result.stats.totalLiftTime)} min on lifts)
          </div>
        </div>
      );
    }

    function RunSearch() {
      const [query, setQuery] = useState("");
      const [filterDiff, setFilterDiff] = useState("all");
      const [expanded, setExpanded] = useState(false);

      const allRuns = useMemo(() =>
        Object.values(RUNS).sort((a,b) => a.name.localeCompare(b.name)),
      []);

      const filtered = useMemo(() => {
        return allRuns.filter(r => {
          const matchesQuery = !query || r.name.toLowerCase().includes(query.toLowerCase());
          const matchesDiff = filterDiff === "all" || r.difficulty === filterDiff;
          return matchesQuery && matchesDiff;
        });
      }, [allRuns, query, filterDiff]);

      return (
        <div className="bg-mountain-800 rounded-xl p-5 border border-slate-700">
          <button onClick={() => setExpanded(e => !e)}
            className="w-full flex items-center justify-between text-left">
            <h2 className="text-lg font-semibold">Browse runs</h2>
            <span className="text-xs text-slate-400 flex items-center gap-1.5">
              {expanded ? 'Hide' : `${allRuns.length} runs`}
              <span style={{display:'inline-block', transition:'transform 0.2s ease', transform: expanded ? 'rotate(180deg)' : 'rotate(0deg)'}}>▾</span>
            </span>
          </button>

          {expanded && (
            <div className="mt-3 fade-in">
              <input type="text" placeholder="Search runs..." value={query}
                onChange={e => setQuery(e.target.value)}
                className="w-full bg-slate-700 text-white rounded-lg px-3 py-2 mb-3 text-sm border border-slate-600 placeholder-slate-500" />

              <div className="flex gap-2 mb-3 flex-wrap">
                {[["all","All"],["green","Green"],["blue","Blue"],["black","Black"],["double-black","2xBlack"]].map(([k,l]) => (
                  <button key={k} onClick={() => setFilterDiff(k)}
                    className={`text-xs px-2 py-1 rounded-md transition-all ${
                      filterDiff === k ? 'bg-blue-600 text-white' : 'bg-slate-700/50 text-slate-400 hover:bg-slate-700'
                    }`}>{l}</button>
                ))}
              </div>

              <div className="space-y-1 max-h-[350px] overflow-y-auto pr-1">
                {filtered.map(run => {
                  const meta = DIFF_META[run.difficulty];
                  return (
                    <div key={run.id} className="flex items-center gap-2 py-1.5 px-2 rounded-md hover:bg-slate-700/40">
                      <span style={{color: run.difficulty==='black' ? '#e2e8f0' : meta.color, fontSize:'12px'}}>{meta.icon}</span>
                      <span className="text-sm flex-1">{run.name}</span>
                      <span className="text-xs text-slate-500">{run.area}</span>
                    </div>
                  );
                })}
                {filtered.length === 0 && <div className="text-sm text-slate-500 py-4 text-center">No runs found</div>}
              </div>
              <div className="text-xs text-slate-600 mt-2">{filtered.length} of {allRuns.length} runs</div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [routeResult, setRouteResult] = useState(null);
      const [hoveredRunId, setHoveredRunId] = useState(null);
      const [showEditor, setShowEditor] = useState(false);
      const [activeSectionIdx, setActiveSectionIdx] = useState(0);

      useEffect(() => {
        const handleKey = (e) => {
          if (e.shiftKey && e.key === 'E') setShowEditor(prev => !prev);
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, []);

      // Group steps into sections: each lift starts a new section, subsequent runs belong to it
      const sections = useMemo(() => {
        if (!routeResult) return [];
        const segs = [];
        let cur = null;
        routeResult.steps.forEach((step, i) => {
          if (step.type === 'lift') {
            if (cur) segs.push(cur);
            cur = { liftStep: step, stepIndices: [i], stepIds: new Set([step.id]) };
          } else if (cur) {
            cur.stepIndices.push(i);
            cur.stepIds.add(step.id);
          }
        });
        if (cur) segs.push(cur);
        return segs;
      }, [routeResult]);

      // Map each step index to its section index
      const stepToSection = useMemo(() => {
        const m = new Map();
        sections.forEach((seg, segIdx) => {
          seg.stepIndices.forEach(stepIdx => m.set(stepIdx, segIdx));
        });
        return m;
      }, [sections]);

      const activeStepIds = sections[activeSectionIdx]?.stepIds || new Set();

      const handleGenerate = useCallback(({ diff, totalMinutes, startBase, bathroomEnabled, bathroomInterval, lunchEnabled }) => {
        const result = generateRoute(diff, totalMinutes, startBase);
        const { steps: stepsWithBreaks, addedTime } = insertBreaks(result.steps, result.stats.endBase, { bathroomEnabled, bathroomInterval, lunchEnabled });
        setRouteResult({
          steps: stepsWithBreaks,
          stats: { ...result.stats, totalTime: result.stats.totalTime + addedTime }
        });
        setActiveSectionIdx(0);
      }, []);

      return (
        <div className="min-h-screen">
          {showEditor && <MapEditor onClose={() => setShowEditor(false)} />}
          <Header />
          <div className="max-w-7xl mx-auto px-4 py-6">
            <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">

              {/* Left: Trail map with route overlay. Sticky on mobile once a route exists, so the map stays visible while scrolling the route list. */}
              <div className={`lg:col-span-3 ${routeResult ? 'sticky top-0 z-20 lg:static lg:top-auto lg:z-auto' : ''}`}>
                <TrailMap route={routeResult} hoveredRunId={hoveredRunId} onHoverRun={setHoveredRunId} activeStepIds={activeStepIds} />
              </div>

              {/* Right: Controls + Route */}
              <div className="lg:col-span-2 space-y-5">
                <RouteConfig onGenerate={handleGenerate} />
                <RouteDisplay
                  result={routeResult}
                  hoveredRunId={hoveredRunId}
                  onHoverRun={setHoveredRunId}
                  sections={sections}
                  stepToSection={stepToSection}
                  activeSectionIdx={activeSectionIdx}
                  setActiveSectionIdx={setActiveSectionIdx}
                />
                <RunSearch />
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
